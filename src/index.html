  <!-- Instant System Theme Initializer (Defaults to System Theme, Prevents FOUC) -->
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get('theme');
        var explicitTheme = localStorage.getItem('rajdip_theme_explicit');
        
        // System preference detection (prefers-color-scheme)
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var systemTheme = prefersDark ? 'dark' : 'light';
        
        // Priority: 1. URL Query Param (?theme=), 2. Explicit User Override, 3. System Theme
        var theme = (qTheme === 'light' || qTheme === 'dark') ? qTheme :
                    (explicitTheme === 'light' || explicitTheme === 'dark') ? explicitTheme :
                    systemTheme;

        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-bs-theme', theme);
        if (theme === 'light') {
          root.classList.remove('dark');
          root.classList.add('light');
        } else {
          root.classList.remove('light');
          root.classList.add('dark');
        }
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', theme === 'light' ? '#f5f5f7' : '#070b14');
        }
      } catch(e) {}
    })();
  </script>

          return false;
        }
      }, { passive: false });
